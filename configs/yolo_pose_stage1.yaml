# YOLO-Pose Training Configuration - Stage 1
# Person + Wrist Keypoint Detection

model: yolov8n-pose.yaml
data: data/keypoint_dataset.yaml

epochs: 100
batch: 16
imgsz: 640
patience: 50
save: True
save_period: 10
cache: True
device: 0
workers: 8
project: runs/pose
name: weapon_wrist_detection
exist_ok: True

optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1

box: 7.5
cls: 0.5
dfl: 1.5

kobj: 1.5
keypoint_loss_gain: 1.0

pose: 1.0
flipud: 0.0
fliplr: 0.5

hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
blur: 0.0
erasing: 0.0
crop_fraction: 1.0

close_mosaic: 10
amp: True
fraction: 1.0
profile: False
overlap_mask: True
